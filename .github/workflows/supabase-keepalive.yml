# Supabase (plan gratuito) pausa el proyecto tras ~7 días sin actividad y la web pasa a
# guardar solo en el navegador. Una consulta cada 3 días lo mantiene activo.
name: Supabase keep-alive

on:
  schedule:
    - cron: '0 7 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar la tabla de cámaras
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          curl -fsS -o /dev/null -w "HTTP %{http_code}\n" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/cameras?select=id&limit=1"
